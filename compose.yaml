name: playable-moments
services:
  app:
    build: .
    image: playable-moments:local
    init: true
    restart: unless-stopped
    env_file: ${PM_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      APP_MODE: real
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      APP_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}
      TWITCH_REDIRECT_URI: https://${PUBLIC_HOST}/auth/twitch/callback
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 25s
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  proxy:
    build: ./ops/proxy
    image: playable-moments-proxy:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  app_data:
  caddy_data:
  caddy_config:
