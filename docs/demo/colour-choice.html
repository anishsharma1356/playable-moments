<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playable Moments — original colour-choice scene</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:Arial,sans-serif;background:radial-gradient(ellipse at 20% 75%,#252047,#0b0d16 65%);color:#f5f4fb}.scene{position:absolute;left:86px;top:80px;width:1020px}.brand{color:#b5a0ff;font-size:24px;letter-spacing:5px}h1{font-size:74px;line-height:1.07;margin:70px 0 24px;letter-spacing:-3px}.subtitle{font-size:30px;color:#aaaec4;line-height:1.5;max-width:850px}.choices{display:flex;gap:30px;margin-top:62px}.card{width:450px;height:300px;border:2px solid #484253;border-radius:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s,transform .5s,background .5s}.red{background:linear-gradient(135deg,#6b283d,#382032)}.blue{background:linear-gradient(135deg,#243c70,#1c243f)}.letter{font-size:110px;font-weight:700}.label{font-size:34px;letter-spacing:3px}.foot{font-size:26px;color:#bdb5cf;margin-top:55px}.selected{transform:scale(1.04);border:4px solid #fafafa;box-shadow:0 0 60px #bdb0ff33}.muted{opacity:.2}#reveal{font-size:44px;color:#fff;margin-top:35px;min-height:60px}.hint{position:absolute;left:86px;bottom:36px;color:#747d96;font-size:19px}.hint span{margin-right:25px}
</style>
<div class="scene"><div class="brand">PLAYABLE MOMENTS / COLOUR CHOICE</div><h1 id="heading">Which colour<br>should I choose?</h1><p class="subtitle" id="subtitle">Make your choice in Twitch chat.<br>The creator chooses after responses lock.</p><div class="choices"><div class="card red" id="a"><span class="letter">A</span><span class="label">RED</span></div><div class="card blue" id="b"><span class="letter">B</span><span class="label">BLUE</span></div></div><div id="reveal" aria-live="polite"></div><div class="foot" id="foot">Your replay choice will be your own.</div></div>
<div class="hint"><span>Original creator-controlled scene</span><span>No outcome is selected automatically</span></div>
<script>
let chosen = null;
let audio;
function tone(frequency){try{audio ??= new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=frequency;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.4);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.45)}catch{}}
function choose(choice){if(chosen)return;chosen=choice;document.querySelector('#'+choice.toLowerCase()).classList.add('selected');document.querySelector(choice==='A'?'#b':'#a').classList.add('muted');document.querySelector('#heading').textContent='The choice is made.';document.querySelector('#subtitle').textContent='This is the creator’s actual recorded choice.';document.querySelector('#reveal').textContent=choice==='A'?'A · Red was chosen.':'B · Blue was chosen.';document.querySelector('#foot').textContent='Live responses stay frozen. Replay choices stay personal.';tone(choice==='A'?523.25:659.25)}
function reset(){chosen=null;document.querySelectorAll('.card').forEach(e=>e.classList.remove('selected','muted'));document.querySelector('#heading').innerHTML='Which colour<br>should I choose?';document.querySelector('#subtitle').innerHTML='Make your choice in Twitch chat.<br>The creator chooses after responses lock.';document.querySelector('#reveal').textContent='';document.querySelector('#foot').textContent='Your replay choice will be your own.'}
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='a')choose('A');if(e.key.toLowerCase()==='b')choose('B');if(e.code==='Space'||e.key===' '||e.key==='Spacebar'){e.preventDefault();reset()}if(e.key.toLowerCase()==='t')tone(440)});
</script>
</html>
