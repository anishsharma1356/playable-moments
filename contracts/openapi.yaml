              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
  /api/owner/moments/{momentId}/outcome:
    post:
      summary: Record actual creator choice and real outcome
      operationId: post_api_owner_moments_momentId_outcome
      description: Record actual creator choice and real outcome
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeInput'
  /api/owner/moments/{momentId}/media:
    post:
      summary: Upload authorised MP4 and queue normalisation
      operationId: post_api_owner_moments_momentId_media
      description: Stream bounded upload, validate/decode server-side, and retain
        original privately. Repeated upload keys resolve only after file content hash
        validation; different bytes with the same key are a conflict.
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedJob'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      - name: X-Moment-Version
        in: header
        required: true
        description: Optimistic moment version before replacing the source.
        schema:
          type: integer
          minimum: 1
      - name: X-Content-SHA256
        in: header
        required: true
        description: Lowercase SHA-256 of file bytes; always verified, including retries.
        schema:
          type: string
          pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
  /api/owner/assets/{assetId}/content:
    get:
      summary: Read private asset with owner authentication
      operationId: get_api_owner_assets_assetId_content
      description: Read private asset with owner authentication
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Full authorised file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Authorised single byte-range response
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '416':
          description: Invalid or unsupported Range
        default: *id001
      parameters:
      - name: assetId
        in: path
        required: true
        schema: *id002
      - name: Range
        in: header
        required: false
        schema: *id002
    head:
      summary: Inspect private asset
      operationId: head_api_owner_assets_assetId_content
      description: Inspect private asset
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Full authorised file
        '206':
          description: Authorised single byte-range response
        '416':
          description: Invalid or unsupported Range
        default: *id001
      parameters:
      - name: assetId
        in: path
        required: true
        schema: *id002
      - name: Range
        in: header
        required: false
        schema: *id002
