openapi: 3.1.0
info:
  title: Playable Moments — MVP API (M1 subset implemented)
  version: 1.0.1
  description: Baseline MVP contract with the M0/M1 local subset implemented. Twitch, overlay, deletion and optional completion endpoints remain planned. See docs/PROGRESS.md and contracts/m1-local.openapi.yaml. Binary HEAD responses omit bodies.
servers:
- url: http://localhost:3000
  description: Local development after implementation
paths:
  /auth/twitch/start:
    get:
      summary: Begin browser-bound Twitch OAuth
      operationId: get_auth_twitch_start
      description: Begin browser-bound Twitch OAuth
      tags:
      - Public
      security: []
      responses:
        '302':
          description: Redirect after validated authentication step
        default: &id001
          description: Validation, permission, conflict, provider or state error;
            see error.code.
  /auth/twitch/callback:
    get:
      summary: Complete OAuth and verify allowlisted broadcaster
      operationId: get_auth_twitch_callback
      description: Complete OAuth and verify allowlisted broadcaster
      tags:
      - Public
      security: []
      responses:
        '302':
          description: Redirect after validated authentication step
        default: *id001
      parameters:
      - name: code
        in: query
        required: false
        schema: &id002
          type: string
      - name: state
        in: query
        required: false
        schema: *id002
      - name: error
        in: query
        required: false
        schema: *id002
  /api/owner/me:
    get:
      summary: Get owner identity and CSRF context
      operationId: get_api_owner_me
      description: Get owner identity and CSRF context
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerIdentity'
        default: *id001
  /api/owner/logout:
    post:
      summary: End owner session
      operationId: post_api_owner_logout
      description: End owner session
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default: *id001
      parameters:
      - &id003
        name: X-CSRF-Token
        in: header
        required: true
        schema: *id002
      - &id004
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
  /api/owner/twitch/status:
    get:
      summary: Get Twitch connection health
      operationId: get_api_owner_twitch_status
      description: Get Twitch connection health
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwitchStatus'
        default: *id001
  /api/owner/twitch/disconnect:
    post:
      summary: Disconnect Twitch and interrupt open voting
      operationId: post_api_owner_twitch_disconnect
      description: Disconnect Twitch and interrupt open voting
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default: *id001
      parameters:
      - *id003
      - *id004
  /api/owner/sessions:
    get:
      summary: List owner stream sessions
      operationId: get_api_owner_sessions
      description: List owner stream sessions
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamSession'
        default: *id001
    post:
      summary: Create stream session in configured provenance mode
      operationId: post_api_owner_sessions
      description: Create stream session in configured provenance mode
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSession'
        default: *id001
      parameters:
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
  /api/owner/sessions/{sessionId}/moments:
    get:
      summary: List moments
      operationId: get_api_owner_sessions_sessionId_moments
      description: List moments
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: *id002
    post:
      summary: Create DRAFT moment
      operationId: post_api_owner_sessions_sessionId_moments
      description: Create DRAFT moment
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMoment'
  /api/owner/moments/{momentId}:
    get:
      summary: Read creator-only moment state
      operationId: get_api_owner_moments_momentId
      description: Read creator-only moment state
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
    patch:
      summary: Edit only while DRAFT
      operationId: patch_api_owner_moments_momentId
      description: Edit only while DRAFT
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMoment'
    delete:
      summary: Revoke then deliberately purge moment and files
      operationId: delete_api_owner_moments_momentId
      description: Must report pending cleanup honestly; full success only after deletion
        is complete.
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
  /api/owner/moments/{momentId}/open:
    post:
      summary: Open moment with idempotency and version check
      operationId: post_api_owner_moments_momentId_open
      description: Open moment with idempotency and version check
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
