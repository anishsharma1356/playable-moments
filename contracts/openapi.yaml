  /api/owner/moments/{momentId}/lock:
    post:
      summary: Lock moment with idempotency and version check
      operationId: post_api_owner_moments_momentId_lock
      description: Lock moment with idempotency and version check
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        default: *id001
      parameters:
      - name: momentId
        in: path
        required: true
        schema: *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
  /api/owner/moments/{momentId}/cancel:
    post:
      summary: Cancel moment with idempotency and version check
      operationId: post_api_owner_moments_momentId_cancel
      description: Cancel moment with idempotency and version check
      tags:
      - Owner
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Successful response
          content:
